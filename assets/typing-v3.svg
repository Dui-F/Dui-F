<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 900 65'
    style='background-color: #FFFAF0;'
    width='900px' height='65px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='4100ms' fill='remove'
                    values='m0,32.5 h0 ; m0,32.5 h900 ; m0,32.5 h900 ; m0,32.5 h0' keyTimes='0;0.54634146341463;0.86341463414634;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#39745B' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            edy@workbench ~ $ build something worth opening
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4100ms' fill='remove'
                    values='m0,32.5 h0 ; m0,32.5 h900 ; m0,32.5 h900 ; m0,32.5 h0' keyTimes='0;0.54634146341463;0.86341463414634;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#39745B' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
